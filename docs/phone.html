<script>

});

    st.transform='';st.opacity='';
    try{localStorage.setItem(KEY,JSON.stringify({px:drag.fx,py:drag.fy}));}catch(x){}
    suppress=true;setTimeout(function(){suppress=false;},60);
  }
  drag=null;
}
ic.addEventListener('pointerup',end);
ic.addEventListener('pointercancel',end);
ic.addEventListener('click',function(e){if(suppress){e.stopImmediatePropagation();e.preventDefault();}},true);
})();
</script>
