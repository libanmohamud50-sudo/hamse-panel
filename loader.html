<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hamse Cheats VIP Loader — Premium Edition</title>
<meta name="theme-color" content="#0a0a0f">
<link rel="icon" href="/static/logo.jpg">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#e7e7ee;font-family:system-ui,-apple-system,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background-image:radial-gradient(circle at 20% 10%,rgba(124,92,255,.15),transparent 40%),radial-gradient(circle at 80% 90%,rgba(0,229,255,.12),transparent 40%)}
.card{max-width:420px;width:100%;background:rgba(20,20,29,.7);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.08);border-radius:24px;padding:32px 24px;box-shadow:0 30px 80px -30px rgba(124,92,255,.4)}
.logo-wrap{width:120px;height:120px;margin:0 auto 20px;border-radius:50%;overflow:hidden;border:2px solid rgba(124,92,255,.5);box-shadow:0 0 40px rgba(124,92,255,.4);position:relative}
.logo-wrap img{width:100%;height:100%;object-fit:cover;display:block}
.logo-wrap::after{content:'';position:absolute;inset:-10px;border-radius:50%;background:conic-gradient(from 0deg,#7c5cff,#00e5ff,#7c5cff);z-index:-1;animation:spin 4s linear infinite;opacity:.6}
@keyframes spin{to{transform:rotate(360deg)}}
h1{font-size:22px;font-weight:900;text-align:center;background:linear-gradient(90deg,#7c5cff,#00e5ff);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.5px}
.subtitle{text-align:center;color:#ffb84d;font-size:12px;letter-spacing:.3em;text-transform:uppercase;margin-top:6px;font-weight:700}
.tagline{text-align:center;color:#8a8a9a;font-size:13px;margin-top:14px;line-height:1.5}
label{display:block;font-size:11px;color:#8a8a9a;letter-spacing:.15em;text-transform:uppercase;margin-bottom:8px;font-weight:600;margin-top:24px}
input{width:100%;padding:14px 16px;border-radius:14px;background:#0f0f16;border:1px solid rgba(255,255,255,.1);color:#e7e7ee;font-size:15px;font-family:inherit;outline:none;transition:.2s;letter-spacing:1px}
input:focus{border-color:#7c5cff;box-shadow:0 0 0 3px rgba(124,92,255,.15)}
.btn{width:100%;margin-top:16px;padding:16px;border-radius:14px;background:linear-gradient(90deg,#7c5cff,#00e5ff);color:#0a0a0f;font-weight:800;font-size:15px;letter-spacing:.05em;border:none;cursor:pointer;transition:.2s;text-transform:uppercase}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.status{margin-top:16px;padding:12px;border-radius:12px;font-size:13px;text-align:center;display:none}
.status.info{display:block;background:rgba(124,92,255,.1);border:1px solid rgba(124,92,255,.3);color:#b8a8ff}
.status.ok{display:block;background:rgba(0,229,255,.1);border:1px solid rgba(0,229,255,.3);color:#00e5ff}
.status.err{display:block;background:rgba(255,61,129,.1);border:1px solid rgba(255,61,129,.3);color:#ff3d81}
.tg-row{margin-top:24px;display:flex;gap:10px}
.tg-btn{flex:1;padding:12px;border-radius:12px;text-align:center;font-size:12px;font-weight:700;text-decoration:none;letter-spacing:.03em;transition:.2s}
.tg-main{background:#229ED9;color:#fff}
.tg-alt{background:transparent;border:1px solid rgba(255,255,255,.15);color:#e7e7ee}
.footer{text-align:center;margin-top:20px;font-size:10px;color:#555;letter-spacing:.1em}
.footer .owner{color:#ffb84d;font-weight:700;margin-top:4px;letter-spacing:.15em}
</style>
</head>
<body>
<div class="card">
<div class="logo-wrap"><img src="/static/logo.jpg" alt="Hamse Cheats"></div>
<h1>HAMSE CHEATS VIP LOADER</h1>
<div class="subtitle">Premium Edition</div>
<p class="tagline">Enter your license key to unlock premium access.</p>

<label>License Key</label>
<input id="key" type="text" placeholder="HC-XXXXXX" autocomplete="off" spellcheck="false">

<button class="btn" id="submit">Activate Premium</button>
<div class="status" id="status"></div>

<div class="tg-row">
<a class="tg-btn tg-main" href="https://t.me/hamsecheatsvip" target="_blank">Message Us</a>
<a class="tg-btn tg-alt" href="https://t.me/HAMSECHEATS" target="_blank">Join Channel</a>
</div>

<div class="footer">
<div>© 2026 HAMSE CHEATS</div>
<div class="owner">@hamsecheatsvip</div>
</div>
</div>

<script>
const $ = s => document.querySelector(s);
const status = $('#status'), btn = $('#submit'), inp = $('#key');
function show(cls, msg){ status.className = 'status ' + cls; status.textContent = msg; }
inp.addEventListener('input', e => {
  let v = e.target.value.toUpperCase().replace(/[^A-Z0-9-]/g,'');
  if (!v.startsWith('HC-') && v.length > 0) v = 'HC-' + v.replace(/^HC-?/,'');
  e.target.value = v.slice(0, 9);
});
btn.addEventListener('click', async () => {
  const key = inp.value.trim();
  if (key.length < 9) { show('err', 'Enter a valid key (HC-XXXXXX)'); return; }
  btn.disabled = true; btn.textContent = 'Verifying...';
  show('info', 'Contacting server...');
  try {
    const r = await fetch('/api/verify', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ key })
    });
    const d = await r.json();
    if (d && d.valid) {
      show('ok', '✓ Key accepted — Premium unlocked');
      btn.textContent = 'Premium Active';
    } else {
      show('err', d && d.error ? d.error : 'Invalid or expired key');
      btn.disabled = false; btn.textContent = 'Activate Premium';
    }
  } catch(e) {
    show('err', 'Server unreachable — try again');
    btn.disabled = false; btn.textContent = 'Activate Premium';
  }
});
</script>
</body>
</html>
