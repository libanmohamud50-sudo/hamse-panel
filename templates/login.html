<!DOCTYPE html><html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hamse Cheats Panel XYZ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#000;color:#fff;font-family:-apple-system,system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px;background:radial-gradient(circle at 20% 10%,#ff003325,transparent 35%),radial-gradient(circle at 80% 90%,#7c00ff20,transparent 35%),#000}
.box{background:linear-gradient(180deg,#0c0c0c,#080808);border:1px solid #1a1a1a;border-radius:22px;padding:28px 22px;width:100%;max-width:380px;box-shadow:0 0 80px #ff003325;position:relative;overflow:hidden}
.box::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#ff0033,#7c00ff,transparent)}
.logo{width:100px;height:100px;margin:0 auto 16px;border-radius:50%;background:#000;display:flex;align-items:center;justify-content:center;box-shadow:0 0 40px #ff003360;overflow:hidden;border:2px solid #ff003340}
.logo img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.brand{text-align:center;font-size:20px;font-weight:800;background:linear-gradient(90deg,#fff,#ff6b6b,#7c00ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px;line-height:1.2}
.sub{text-align:center;color:#ff3355;font-size:10px;letter-spacing:3px;margin-bottom:4px;font-weight:700}
.own{text-align:center;color:#555;font-size:9px;letter-spacing:2px;margin-bottom:22px}
label{font-size:10px;color:#888;letter-spacing:2px;margin-bottom:6px;display:block;margin-left:2px}
input{width:100%;background:#050505;border:1px solid #1a1a1a;border-radius:12px;padding:14px;color:#fff;font-size:14px;margin-bottom:12px;outline:none;transition:.25s}
input:focus{border-color:#ff0033;box-shadow:0 0 0 3px #ff003325}
.pw{position:relative}
.pw input{padding-right:44px}
.eye{position:absolute;right:12px;top:14px;color:#666;cursor:pointer;font-size:16px}
.btn{width:100%;background:linear-gradient(90deg,#ff0033,#7c00ff);color:#fff;border:0;border-radius:12px;padding:15px;font-size:13px;font-weight:700;letter-spacing:2px;cursor:pointer;margin-top:6px}
.btn:active{transform:scale(.97)}
.btn.load{opacity:.6;pointer-events:none}
.err{background:#ff003320;color:#ff8080;padding:10px;border-radius:10px;font-size:12px;text-align:center;margin-bottom:14px;border:1px solid #ff003340}
.foot{text-align:center;font-size:9px;color:#333;margin-top:18px;letter-spacing:1px}
</style></head><body>
<div class="box">
  <div class="logo"><img src="https://i.ibb.co/HLh5MBNr/IMG-20261002-222716-815.jpg" onerror="this.parentElement.innerHTML='🔥'"></div>
  <div class="brand">HAMSE CHEATS<br>PANEL XYZ</div>
  <div class="sub">4.6.0 VIP PANEL</div>
  <div class="own">@HAMSECHEATSVIP</div>
  {% if err %}<div class="err">{{err}}</div>{% endif %}
  <form method="post" action="/login" onsubmit="return load(this)">
    <label>USERNAME</label>
    <input name="u" placeholder="Username" required autocomplete="off">
    <label>PASSWORD</label>
    <div class="pw">
      <input name="p" id="pw" type="password" placeholder="••••••••" required>
      <span class="eye" onclick="tog()">👁</span>
    </div>
    <button class="btn" type="submit" id="btn">LOGIN TO PANEL</button>
  </form>
  <div class="foot">© 2026 Hamse Cheats Panel XYZ • @hamsecheatsvip</div>
</div>
<script>
function tog(){const p=document.getElementById('pw');p.type=p.type==='password'?'text':'password'}
function load(f){const b=f.querySelector('.btn');b.classList.add('load');b.textContent='LOADING...';return true}
</script>
</body></html>
