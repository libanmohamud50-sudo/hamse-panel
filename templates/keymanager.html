<!DOCTYPE html><html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hamse cheats panel</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--accent:#ff0033;--accent2:#7c00ff;--bg:#000;--card:#0c0c0c;--border:#1a1a1a;--text:#fff;--muted:#666}
[data-theme="light"]{--bg:#f5f5f7;--card:#fff;--border:#e0e0e0;--text:#111;--muted:#666}
[data-accent="red"]{--accent:#ff0033;--accent2:#7c00ff}
[data-accent="purple"]{--accent:#7c00ff;--accent2:#c800ff}
[data-accent="cyan"]{--accent:#00bcd4;--accent2:#00e5ff}
[data-accent="green"]{--accent:#00c853;--accent2:#00e676}
body{background:var(--bg);color:var(--text);font-family:-apple-system,system-ui,sans-serif;min-height:100vh;padding:14px}
.hamb{position:fixed;top:14px;left:14px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:8px 10px;font-size:16px;cursor:pointer;z-index:101;color:var(--text)}
.breadcrumb{font-size:10px;color:var(--muted);letter-spacing:2px;margin:14px 0 14px;padding-left:44px}
.breadcrumb b{color:var(--accent)}
.sec{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:12px}
.sec h3{font-size:12px;letter-spacing:2px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.genbtn{background:var(--accent);border:0;color:#fff;border-radius:8px;padding:6px 12px;font-size:10px;cursor:pointer;font-weight:700}
.search{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px;color:var(--text);font-size:13px;margin-bottom:12px;outline:none}
.search:focus{border-color:var(--accent)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.f{background:var(--bg);border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:6px 12px;font-size:11px;cursor:pointer}
.f.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.kb{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.kb .kc{font-family:ui-monospace,monospace;font-size:12px;color:var(--accent);flex:1;word-break:break-all;font-weight:700;min-width:100px}
.kb .st{font-size:9px;padding:3px 8px;border-radius:6px;background:#00ff2015;color:#00ff80;font-weight:700;text-transform:uppercase}
.kb .st.used{background:#ffaa0015;color:#ffaa00}
.kb .st.expired{background:#88888820;color:#888}
.kb .st.revoked{background:#ff003325;color:#ff6080}
.kb .dur{font-size:10px;color:var(--muted);font-weight:700;letter-spacing:1px}
.kb .x{background:var(--border);border:0;color:var(--text);border-radius:7px;padding:6px 8px;font-size:11px;cursor:pointer}
.foot{text-align:center;font-size:9px;color:var(--muted);margin:18px 0;letter-spacing:2px}
</style></head><body data-theme="{{theme}}" data-accent="{{accent}}">
<div class="hamb" onclick="location.href='/dashboard'">←</div>
<div class="breadcrumb">DASHBOARD / <b>KEY MANAGER</b></div>

<div class="sec">
  <h3>🔑 All License Keys <button class="genbtn" onclick="location.href='/generate'">+ Generate</button></h3>
  <input class="search" id="search" placeholder="🔍 Search key..." oninput="filter()">
  <div class="filters">
    <div class="f on" onclick="setF(this,'all')">All</div>
    <div class="f" onclick="setF(this,'unused')">Unused</div>
    <div class="f" onclick="setF(this,'used')">Used</div>
    <div class="f" onclick="setF(this,'expired')">Expired</div>
    <div class="f" onclick="setF(this,'revoked')">Revoked</div>
  </div>
  <div id="ks">
    {% for k in keys %}
    <div class="kb" data-st="{{k['st']}}" data-k="{{k['k']}}">
      <div class="kc">{{k['k']}}</div>
      <div class="dur">{{k['duration']}}</div>
      <div class="st {{k['st']}}">{{k['st']}}</div>
      <button class="x" onclick="navigator.clipboard.writeText('{{k['k']}}');this.textContent='✅'">📋</button>
      <button class="x" onclick="revokeKey({{k['id']}})">⛔</button>
      <button class="x" onclick="extendKey({{k['id']}},24)">+1d</button>
      <button class="x" onclick="extendKey({{k['id']}},168)">+7d</button>
      <button class="x" onclick="del({{k['id']}})">✕</button>
    </div>
    {% endfor %}
    {% if not keys %}<div style="color:var(--muted);font-size:11px;text-align:center;padding:14px">Ma jiro key</div>{% endif %}
  </div>
</div>

<div class="foot">© 2026 Hamse cheats panel • @hamsecheatsvip</div>
<script>
let curF='all';
function setF(e,f){curF=f;document.querySelectorAll('.f').forEach(x=>x.classList.remove('on'));e.classList.add('on');filter()}
function filter(){
  const q=document.getElementById('search').value.toLowerCase();
  document.querySelectorAll('.kb').forEach(x=>{
    const k=x.dataset.k.toLowerCase(); const st=x.dataset.st;
    const ok1=q===''||k.includes(q); const ok2=curF==='all'||st===curF;
    x.style.display=(ok1&&ok2)?'flex':'none';
  });
}
async function del(i){await fetch('/api/del/'+i,{method:'POST'});location.reload()}
async function revokeKey(i){await fetch('/api/revoke/'+i,{method:'POST'});location.reload()}
async function extendKey(i,h){await fetch('/api/extend/'+i,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({h:h})});location.reload()}
</script>
</body></html>
